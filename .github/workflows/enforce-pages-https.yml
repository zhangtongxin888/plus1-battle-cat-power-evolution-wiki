name: Enforce Pages HTTPS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce-https:
    runs-on: ubuntu-latest
    steps:
      - name: Enable HTTPS when the certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.https_enforced')"
          if [[ "${current}" == "true" ]]; then
            echo "GitHub Pages HTTPS is already enforced."
            exit 0
          fi

          echo "HTTPS is not enforced yet; requesting it now."
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -F https_enforced=true